<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no"
    >

    <meta name="theme-color" content="#050505">

    <title>Chat | JOSA AI</title>

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/chat.css">
</head>

<body>

    <div class="josa-chat-app">

        <!-- SIDEBAR -->

        <aside class="chat-sidebar" id="chatSidebar">

            <div class="sidebar-header">

                <a href="../index.html" class="sidebar-brand">
                    <span class="sidebar-logo">J</span>
                    <strong>JOSA AI</strong>
                </a>

                <button
                    class="sidebar-close"
                    id="closeSidebar"
                    aria-label="Close sidebar"
                >
                    ×
                </button>

            </div>

            <button class="new-chat-button" id="newChatButton">
                <span>＋</span>
                <strong>New chat</strong>
            </button>

            <div class="sidebar-section">

                <p class="sidebar-label">Recent chats</p>

                <div class="chat-history" id="chatHistory">

                    <button class="history-item active">
                        <span>◌</span>
                        <span>New conversation</span>
                    </button>

                </div>

            </div>

            <div class="sidebar-bottom">

                <a href="profile.html" class="sidebar-link">
                    <span>♙</span>
                    Profile
                </a>

                <a href="about.html" class="sidebar-link">
                    <span>ⓘ</span>
                    About JOSA
                </a>

            </div>

        </aside>

        <!-- SIDEBAR OVERLAY -->

        <div
            class="sidebar-overlay"
            id="sidebarOverlay"
        ></div>

        <!-- MAIN CHAT -->

        <main class="chat-main">

            <!-- TOP BAR -->

            <header class="chat-topbar">

                <button
                    class="menu-button"
                    id="openSidebar"
                    aria-label="Open sidebar"
                >
                    ☰
                </button>

                <div class="chat-title">
                    <strong>JOSA AI</strong>
                    <span>Personal AI companion</span>
                </div>

                <button
                    class="chat-options"
                    aria-label="Chat options"
                >
                    ⋯
                </button>

            </header>

            <!-- MESSAGES -->

            <section
                class="messages-container"
                id="messagesContainer"
            >

                <div class="welcome-message">

                    <div class="welcome-logo">J</div>

                    <h1>How can I help you?</h1>

                    <p>
                        Ask JOSA anything. Your intelligent
                        companion is ready.
                    </p>

                </div>

            </section>

            <!-- INPUT AREA -->

            <footer class="chat-input-area">

                <div class="chat-input-wrapper">

                    <button
                        class="input-action"
                        id="attachmentButton"
                        aria-label="Attach file"
                    >
                        ＋
                    </button>

                    <textarea
                        id="messageInput"
                        rows="1"
                        placeholder="Message JOSA AI..."
                        aria-label="Message JOSA AI"
                    ></textarea>

                    <button
                        class="voice-button"
                        id="voiceButton"
                        aria-label="Voice input"
                    >
                        ◉
                    </button>

                    <button
                        class="send-button"
                        id="sendButton"
                        aria-label="Send message"
                    >
                        ↑
                    </button>

                </div>

                <p class="input-disclaimer">
                    JOSA AI can make mistakes. Check important information.
                </p>

            </footer>

        </main>

    </div>

    <script src="../js/chat.js"></script>

</body>
</html>
