<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover"
    >

    <meta name="theme-color" content="#050505">

    <title>Sign in | JOSA AI</title>

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <div class="login-app">

        <div class="login-logo">J</div>

        <h1>JOSA</h1>
        <p>Your personal AI companion</p>

        <button class="google-button" id="googleButton">
            Continue with Google
        </button>

        <div class="login-status" id="loginStatus"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        "use strict";

        const googleButton = document.getElementById("googleButton");
        const loginStatus = document.getElementById("loginStatus");

        googleButton.addEventListener("click", async () => {
            loginStatus.textContent = "Opening Google sign-in...";
            try {
                await signInWithGoogle();
            } catch (error) {
                loginStatus.textContent = "Sign-in failed. Please try again.";
                console.error(error);
            }
        });

        // If already signed in, skip straight to chat.
        getSession().then((session) => {
            if (session) {
                window.location.href = "chat.html";
            }
        });
    </script>

</body>
</html>
